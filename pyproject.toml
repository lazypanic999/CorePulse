[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corepulse"
version = "0.1.0"
description = "Discovery and controlled fault experiments for a local 5G core lab"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
corepulse = "corepulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
