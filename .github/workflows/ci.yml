name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o corepulse ./cmd/corepulse
      - name: Check CLI dry run
        run: ./corepulse pod-crash --target amf
