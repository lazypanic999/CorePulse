name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Run tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Lab script fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build
        run: go build -o corepulse ./cmd/corepulse
      - name: Check CLI dry run
        run: ./corepulse pod-crash --target amf
      - name: Offline synthetic walkthrough
        run: python3 scripts/check-offline-example.py --binary ./corepulse
      - name: Build and execute container without cluster access
        run: |
          docker build --build-arg VERSION=ci -t corepulse-ci .
          test "$(docker run --rm --network none --read-only corepulse-ci version)" = ci
          docker run --rm --network none --read-only --entrypoint kubectl corepulse-ci version --client=true -o json

  portable:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, binary: corepulse.exe }
          - { os: macos-latest, binary: corepulse }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test native checkpoint, ownership and offline behavior
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build native executable
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.binary }} ./cmd/corepulse
      - name: Check deterministic fixtures and both holdout modes
        run: python scripts/check-offline-example.py --binary ./${{ matrix.binary }}
