name: Neural synthetic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      KUBECONFIG: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workspace tool
        run: python -m pip install uv==0.13.7
      - name: Install locked CPU-only dependencies
        run: uv sync --project ml --locked --python 3.12
      - name: Lint
        run: uv run --project ml --locked ruff check ml
      - name: Test only invented offline fixtures
        run: uv run --project ml --locked pytest ml
      - name: CPU tensor smoke
        run: uv run --project ml --locked python -m corepulse_ml.smoke
