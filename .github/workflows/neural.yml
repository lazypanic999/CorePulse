name: Neural synthetic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      KUBECONFIG: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Install pinned workspace tool
        run: python -m pip install uv==0.13.7
      - name: Install locked CPU-only dependencies
        run: uv sync --project ml --locked --python 3.12
      - name: Lint
        run: uv run --project ml --locked ruff check ml
      - name: Test only invented offline fixtures
        run: uv run --project ml --locked pytest ml
      - name: CPU tensor smoke
        run: uv run --project ml --locked python -m corepulse_ml.smoke
      - name: Prepare only the invented offline example
        run: |
          mkdir -p reports/neural-synthetic
          go build -o reports/neural-synthetic/corepulse ./cmd/corepulse
          python scripts/prepare-neural-synthetic.py --binary reports/neural-synthetic/corepulse
      - name: Synthetic experiment report
        run: uv run --project ml --locked python -m corepulse_ml.experiment ml/experiments/synthetic-smoke.yaml --export-dir reports/neural-synthetic/models
      - name: Validate Python report with the Go snapshot reader
        run: COREPULSE_SYNTHETIC_REPORT="$PWD/reports/neural-synthetic/evaluation.json" go test ./internal/evaluation -run '^TestPythonSyntheticSnapshot$' -count=1
