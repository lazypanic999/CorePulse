schema_version: 1
name: synthetic-smoke
synthetic: true
dataset:
  windows: reports/neural-synthetic/windows.csv
  split: reports/neural-synthetic/split.json
references: reports/neural-synthetic/references.json
output: reports/neural-synthetic/evaluation.json
seeds: [7, 23]
inner_validation:
  folds: 2
  seed: 17
# Training methods are added by the subsequent MLP/autoencoder task branches.
methods:
  - kind: mlp
    hidden: [8]
    epochs: [10, 25]
    learning_rate: 0.01
    weight_decay: 0.0
  - kind: autoencoder
    hidden: [4, 2]
    epochs: 25
    learning_rate: 0.01
    weight_decay: 0.0
    percentile: 95
    calibration_fold: 0
